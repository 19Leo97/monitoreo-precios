version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bd_monitoreo_precios
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: MiPasswordSecreto123
      POSTGRES_DB: retail_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: orquestador_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=clave_secreta_n8n_12345
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
    restart: always

volumes:
  postgres_data:
  n8n_data:
